name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24.22.2
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - uses: curlewlabs-com/ci-baseline/typed@6a09b1b1ebea0453f9a34fce974610ef2544ec3a # v0.3.0
      - run: npm test
      # The tests import the TypeScript source; this proves the tarball a
      # consumer installs carries both entry points and that they load.
      - name: Install the packed tarball and import it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          consumer="$RUNNER_TEMP/consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          # Extracted rather than installed: the package has no dependencies,
          # scripts or bins, so this is the tree npm would write, by no command
          # that could reach the registry. A dependency added later fails the
          # import below rather than passing unnoticed.
          mkdir -p node_modules/@curlewlabs-com/app-store-jws
          tar -xzf "$RUNNER_TEMP"/curlewlabs-com-app-store-jws-*.tgz --strip-components=1 \
            -C node_modules/@curlewlabs-com/app-store-jws
          node --input-type=module -e '
            import { appleRootCertificate, verifyAppleSignedData } from "@curlewlabs-com/app-store-jws";
            import { parseX509Certificate } from "@curlewlabs-com/app-store-jws/x509";
            const root = parseX509Certificate(appleRootCertificate());
            if (root === null || !root.isCertificateAuthority) throw new Error("root did not parse");
            const result = await verifyAppleSignedData("e30.e30.e30", appleRootCertificate());
            if (result.kind !== "refused") throw new Error("junk was not refused");
          '

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@6a09b1b1ebea0453f9a34fce974610ef2544ec3a # v0.3.0

  conclusion:
    # The one check branch protection requires, so adding a job means listing it
    # here rather than in the repository settings.
    needs: [test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$TEST" = success && test "$BASELINE" = success
